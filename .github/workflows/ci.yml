name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Update installer
        run: python -m pip install --disable-pip-version-check --upgrade 'pip>=26.2'

      - name: Install project and quality tools
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Check types
        run: python -m mypy src/fem_toolbox

  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Update installer
        run: python -m pip install --disable-pip-version-check --upgrade 'pip>=26.2'

      - name: Install project and test tools
        run: python -m pip install --disable-pip-version-check -e '.[test]'

      - name: Run tests
        run: python -m pytest

  compatibility:
    name: Compatibility / Python ${{ matrix.python-version }} / ${{ matrix.dependency_set }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
        dependency_set:
          - oldest
          - latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ci/oldest-constraints.txt

      - name: Update installer
        run: python -m pip install --disable-pip-version-check --upgrade 'pip>=26.2'

      - name: Install oldest supported combination
        if: matrix.dependency_set == 'oldest'
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -c ci/oldest-constraints.txt '.[test]'

      - name: Install latest resolvable combination
        if: matrix.dependency_set == 'latest'
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: '.[test]'

      - name: Check dependency metadata and installed import
        run: |
          python -m pip check
          python -m pip freeze
          python -c 'from importlib.metadata import metadata; m = metadata("fem-toolbox"); print("Requires-Python:", m["Requires-Python"]); print("License-Expression:", m["License-Expression"]); print("Requires-Dist:", m.get_all("Requires-Dist"))'
          cd "$RUNNER_TEMP"
          python -c 'import fem_toolbox, meshio, numpy, scipy; print(f"fem_toolbox={fem_toolbox.__file__} meshio={meshio.__version__} numpy={numpy.__version__} scipy={scipy.__version__}")'

      - name: Smoke numerical solvers and mesh I/O
        run: python -m pytest tests/regression/test_piezo_d33_benchmark.py tests/regression/test_thermopiezo_example.py tests/unit/test_mesh_io.py
