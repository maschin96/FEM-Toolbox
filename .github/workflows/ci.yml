name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-build:
    name: Build release artifacts
    runs-on: ubuntu-24.04
    container:
      image: python:3.13-bookworm@sha256:073ffebb96ae4d0ed73ccad59f08c47bd84af8a79f5258130f8458ac50ad9ff4
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create isolated Python environment
        run: |
          python -m venv "$RUNNER_TEMP/job-env"
          echo "$RUNNER_TEMP/job-env/bin" >> "$GITHUB_PATH"
      - name: Build wheel and sdist with isolated build dependencies
        run: |
          python -m pip install --disable-pip-version-check 'pip>=26.2' build
          python -m build
          cp examples/steady_heat.py examples/elastic_tension.py examples/parallel_plate.py examples/thermal_expansion.py examples/piezo_d33.py dist/
          cp -R examples/thermopiezoelectric dist/thermopiezoelectric
          cp -R examples/transient_heat dist/transient_heat
          cp -R examples/piezo_dynamics dist/piezo_dynamics
          cp -R examples/study_recipes dist/study_recipes
          cp -R examples/parameter_study dist/parameter_study
          cp -R examples/surrogate_heat dist/surrogate_heat
          cp -R examples/uncertainty_heat dist/uncertainty_heat
          cp -R examples/adaptive_heat dist/adaptive_heat
          cp -R examples/topology dist/topology
          cp -R examples/field_visualization dist/field_visualization
          cp -R examples/tet10_heat dist/tet10_heat
          cp -R examples/tet10_electrostatics dist/tet10_electrostatics
          cp -R examples/tet10_elasticity dist/tet10_elasticity
          cp -R examples/tet10_thermomechanics dist/tet10_thermomechanics
          cp -R examples/tet10_piezoelectric dist/tet10_piezoelectric
          cp -R examples/tet10_thermopiezoelectric dist/tet10_thermopiezoelectric
          cp -R examples/tet10_modes dist/tet10_modes
          cp -R examples/tet10_newmark dist/tet10_newmark
          cp -R examples/tet10_harmonic dist/tet10_harmonic
          cd dist
          sha256sum *.whl *.tar.gz *.py thermopiezoelectric/* transient_heat/* piezo_dynamics/* tet10_heat/* tet10_electrostatics/* tet10_elasticity/* tet10_thermomechanics/* tet10_piezoelectric/* tet10_thermopiezoelectric/* tet10_modes/* tet10_newmark/* tet10_harmonic/* parameter_study/* surrogate_heat/* uncertainty_heat/* adaptive_heat/* field_visualization/* study_recipes/*.py study_recipes/*.md study_recipes/heat/* study_recipes/piezo/* topology/*.py topology/*.md topology/reference/* > SHA256SUMS
      - name: Transfer artifacts and standalone solver example
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 7

  artifacts:
    name: Artifacts / Python ${{ matrix.python-version }} / ${{ matrix.distribution }}
    needs: artifact-build
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.python-image }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            python-image: python:3.11-bookworm@sha256:5887f265d8d44d8b4734d3658b21d668edf5aaf92e4945bc0c984afbfab105d3
          - python-version: "3.12"
            python-image: python:3.12-bookworm@sha256:5560e9ab8709f459489e5b8aa696eda8a07ef821e14bb122be62d91234bfa98b
          - python-version: "3.13"
            python-image: python:3.13-bookworm@sha256:073ffebb96ae4d0ed73ccad59f08c47bd84af8a79f5258130f8458ac50ad9ff4
        python-version: ["3.11", "3.12", "3.13"]
        distribution: [wheel, sdist]
    # No checkout; use a fresh directory outside the persistent runner workspace.
    # Only transferred archives/examples may participate in installed-package tests.
    steps:
      - name: Create isolated artifact directory
        working-directory: ${{ runner.temp }}
        run: |
          candidate_dir=$(mktemp -d "$RUNNER_TEMP/candidate.XXXXXX")
          echo "CANDIDATE_DIR=$candidate_dir" >> "$GITHUB_ENV"
      - name: Download candidate from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-candidate
          path: ${{ env.CANDIDATE_DIR }}/candidate
      - name: Verify transfer and create fresh environment
        working-directory: ${{ env.CANDIDATE_DIR }}
        run: |
          cd candidate
          sha256sum --check SHA256SUMS
          python -m venv "$RUNNER_TEMP/artifact-env"
          "$RUNNER_TEMP/artifact-env/bin/python" -m pip install --upgrade 'pip>=26.2'
      - name: Install wheel
        if: matrix.distribution == 'wheel'
        working-directory: ${{ env.CANDIDATE_DIR }}
        run: '"$RUNNER_TEMP/artifact-env/bin/python" -m pip install candidate/*.whl'
      - name: Install sdist with isolated build dependencies
        if: matrix.distribution == 'sdist'
        working-directory: ${{ env.CANDIDATE_DIR }}
        run: '"$RUNNER_TEMP/artifact-env/bin/python" -m pip install candidate/*.tar.gz'
      - name: Verify installed metadata and numerical solver
        working-directory: ${{ env.CANDIDATE_DIR }}
        run: |
          "$RUNNER_TEMP/artifact-env/bin/python" -m pip check
          "$RUNNER_TEMP/artifact-env/bin/python" -m pip freeze
          "$RUNNER_TEMP/artifact-env/bin/python" -I - <<'PY'
          import sys
          from importlib.metadata import distribution
          from importlib.util import find_spec
          from pathlib import Path
          import fem_toolbox
          from fem_toolbox.errors import ValidationError
          from fem_toolbox.solvers.petsc_backend import PetscBackend, PetscFieldSplitBackend

          package = Path(fem_toolbox.__file__).resolve()
          assert package.is_relative_to(Path(sys.prefix).resolve()), package
          dist = distribution("fem-toolbox")
          assert dist.version == fem_toolbox.__version__ == "1.6.0"
          assert dist.metadata["License-Expression"] == "MIT"
          licenses = [f for f in dist.files if f.name == "LICENSE"]
          assert len(licenses) == 1, licenses
          assert "Permission is hereby granted" in dist.locate_file(licenses[0]).read_text()
          assert find_spec("matplotlib") is None, "core requires Matplotlib"
          from fem_toolbox.post.visualization import plot_field
          from fem_toolbox.mesh import Mesh
          try:
              plot_field(Mesh(points=[[0,0,0],[1,0,0],[0,1,0],[0,0,1]], tetra4=[[0,1,2,3]]), [1], association="cell", name="T", unit="K")
          except ImportError as error:
              assert "fem-toolbox[visualization]" in str(error)
          else:
              raise AssertionError("missing Matplotlib must fail explicitly")
          assert find_spec("petsc4py") is None, "core artifact unexpectedly needs PETSc"
          for backend in (PetscBackend, PetscFieldSplitBackend):
              try:
                  backend()
              except ValidationError as error:
                  assert "petsc4py" in str(error)
              else:
                  raise AssertionError("missing PETSc must fail explicitly")
          print(package, dist.version, dist.metadata["Requires-Python"])
          PY
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/study_recipes/run.py" heat --output recipe_heat_results
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/study_recipes/run.py" piezo --output recipe_piezo_results
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/uncertainty_heat/run.py" --output uncertainty_heat_results
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/uncertainty_heat/run.py" --output uncertainty_heat_results
          test -s uncertainty_heat_results/uncertainty.json
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/adaptive_heat/run_adaptive.py" --output adaptive_heat_results --steps 4
          test -s adaptive_heat_results/comparison.json
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/topology/run.py" --output topology_results
          test -s topology_results/geometry/reanalysis.json
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/steady_heat.py"
          test -s steady_heat.vtu
          for example in elastic_tension parallel_plate thermal_expansion piezo_d33; do
            "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/$example.py"
            test -s "$example.vtu"
          done
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/thermopiezoelectric/run.py" --output stationary_model_results
          "$RUNNER_TEMP/artifact-env/bin/python" -I -c 'import json; from math import isclose; r=json.load(open("stationary_model_results/report.json")); m=r["metrics"]; assert isclose(m["free_displacement_x_m"], -9/440, abs_tol=1e-12); assert isclose(m["free_potential_V"], 5/22, abs_tol=1e-12); assert isclose(m["heat_flux_x_W_m2"], -20, abs_tol=1e-12)'
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/transient_heat/run.py"
          test -s transient_heat_results/heat.pvd
          test -s transient_heat_results/probes.csv
          test -s transient_heat_results/balance.csv
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/piezo_dynamics/run.py"
          test -s piezo_dynamic_results/transient/piezo.pvd
          test -s piezo_dynamic_results/harmonic/probes.csv
          test -s piezo_dynamic_results/modes/manifest.json
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/tet10_heat/run.py"
          test -s tet10_heat_results/stationary.json
          test -s tet10_heat_results/transient/heat.pvd
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/tet10_electrostatics/run.py"
          test -s tet10_electric_results/electric.json
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/tet10_elasticity/run.py"
          test -s tet10_elastic_results/solid.json
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/tet10_thermomechanics/run.py"
          test -s tet10_thermal_expansion_results/coupled.json
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/tet10_piezoelectric/run.py"
          test -s tet10_piezo_results/piezo.json
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/tet10_thermopiezoelectric/run.py"
          test -s tet10_thermopiezo_results/coupled.json
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/tet10_modes/run.py"
          test -s tet10_modes_results/manifest.json
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/tet10_newmark/run.py"
          test -s tet10_newmark_results/manifest.json
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/tet10_harmonic/run.py"
          test -s tet10_harmonic_results/manifest.json
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/parameter_study/run.py" --max-cases 1
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/parameter_study/run.py"
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/parameter_study/run.py"
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/parameter_study/report.py"
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/surrogate_heat/run.py"
      - name: Install visualization extra and render installed-package example
        working-directory: ${{ env.CANDIDATE_DIR }}
        run: |
          candidate_version=$("$RUNNER_TEMP/artifact-env/bin/python" -I -c 'from importlib.metadata import version; print(version("fem-toolbox"))')
          "$RUNNER_TEMP/artifact-env/bin/python" -m pip install "fem-toolbox[visualization]==$candidate_version"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/artifact-env/bin/python" -I "$CANDIDATE_DIR/candidate/field_visualization/run.py" --output field_images
          "$RUNNER_TEMP/artifact-env/bin/python" -I -c 'from pathlib import Path; from PIL import Image; paths=list(Path("field_images").glob("*.jpg")); assert len(paths)==6; images=[Image.open(p) for p in paths]; assert all(i.format=="JPEG" and i.size==(1200,900) for i in images); [i.close() for i in images]'


  quality:
    name: Quality / Python 3.13
    runs-on: ubuntu-24.04
    container:
      image: python:3.13-bookworm@sha256:073ffebb96ae4d0ed73ccad59f08c47bd84af8a79f5258130f8458ac50ad9ff4
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create isolated Python environment
        run: |
          python -m venv "$RUNNER_TEMP/job-env"
          echo "$RUNNER_TEMP/job-env/bin" >> "$GITHUB_PATH"

      - name: Update installer
        run: python -m pip install --disable-pip-version-check --upgrade 'pip>=26.2'

      - name: Install project and quality tools
        run: python -m pip install --disable-pip-version-check -e '.[dev,visualization]'

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Check types
        run: python -m mypy src/fem_toolbox

  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.python-image }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            python-image: python:3.11-bookworm@sha256:5887f265d8d44d8b4734d3658b21d668edf5aaf92e4945bc0c984afbfab105d3
          - python-version: "3.12"
            python-image: python:3.12-bookworm@sha256:5560e9ab8709f459489e5b8aa696eda8a07ef821e14bb122be62d91234bfa98b
          - python-version: "3.13"
            python-image: python:3.13-bookworm@sha256:073ffebb96ae4d0ed73ccad59f08c47bd84af8a79f5258130f8458ac50ad9ff4
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust the mounted checkout for benchmark provenance
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create isolated Python environment
        run: |
          python -m venv "$RUNNER_TEMP/job-env"
          echo "$RUNNER_TEMP/job-env/bin" >> "$GITHUB_PATH"

      - name: Update installer
        run: python -m pip install --disable-pip-version-check --upgrade 'pip>=26.2'

      - name: Install project and test tools
        run: python -m pip install --disable-pip-version-check -e '.[test,visualization]'

      - name: Run tests
        run: python -m pytest

  compatibility:
    name: Compatibility / Python ${{ matrix.python-version }} / ${{ matrix.dependency_set }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.python-image }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            python-image: python:3.11-bookworm@sha256:5887f265d8d44d8b4734d3658b21d668edf5aaf92e4945bc0c984afbfab105d3
          - python-version: "3.12"
            python-image: python:3.12-bookworm@sha256:5560e9ab8709f459489e5b8aa696eda8a07ef821e14bb122be62d91234bfa98b
          - python-version: "3.13"
            python-image: python:3.13-bookworm@sha256:073ffebb96ae4d0ed73ccad59f08c47bd84af8a79f5258130f8458ac50ad9ff4
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
        dependency_set:
          - oldest
          - latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create isolated Python environment
        run: |
          python -m venv "$RUNNER_TEMP/job-env"
          echo "$RUNNER_TEMP/job-env/bin" >> "$GITHUB_PATH"

      - name: Update installer
        run: python -m pip install --disable-pip-version-check --upgrade 'pip>=26.2'

      - name: Install oldest supported combination
        if: matrix.dependency_set == 'oldest'
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -c ci/oldest-constraints.txt '.[test]'

      - name: Install latest resolvable combination
        if: matrix.dependency_set == 'latest'
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: '.[test]'

      - name: Check dependency metadata and installed import
        run: |
          python -m pip check
          python -m pip freeze
          python -c 'from importlib.metadata import metadata; m = metadata("fem-toolbox"); print("Requires-Python:", m["Requires-Python"]); print("License-Expression:", m["License-Expression"]); print("Requires-Dist:", m.get_all("Requires-Dist"))'
          cd "$RUNNER_TEMP"
          python -c 'import fem_toolbox, meshio, numpy, scipy; print(f"fem_toolbox={fem_toolbox.__file__} meshio={meshio.__version__} numpy={numpy.__version__} scipy={scipy.__version__}")'

      - name: Smoke numerical solvers and mesh I/O
        run: python -m pytest tests/regression/test_piezo_d33_benchmark.py tests/regression/test_thermopiezo_example.py tests/unit/test_mesh_io.py tests/unit/test_studies.py tests/unit/test_study_reports.py tests/unit/test_surrogates.py tests/unit/test_uncertainty.py tests/regression/test_uncertainty_study.py

  petsc:
    name: PETSc / Python 3.12 / ${{ matrix.scalar }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scalar: [real, complex]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build native PETSc test environment
        run: docker build -f ci/petsc.Dockerfile -t fem-toolbox-petsc:test .
      - name: Require native scalar build and run backend verification
        env:
          PETSC_SCALAR: ${{ matrix.scalar }}
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/work:ro"
          fem-toolbox-petsc:test python ci/run_petsc_tests.py
          --scalar "$PETSC_SCALAR" -q tests/petsc -p no:cacheprovider
