    directory: /
    # Deliberate minimum-version fixtures; update the supported floor manually.
    exclude-paths:
      - ci/oldest-constraints.txt
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
