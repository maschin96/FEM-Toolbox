[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fem-toolbox"
version = "1.4.0"
description = "Verified 3D multiphysics finite-element research toolbox"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "meshio>=5.3.5",
  "numpy>=1.26; python_version < '3.13'",
  "numpy>=2.1; python_version >= '3.13'",
  "scipy>=1.12; python_version < '3.13'",
  "scipy>=1.14.1; python_version >= '3.13'",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
visualization = ["matplotlib>=3.9,<4"]
test = [
  "pytest>=8.3",
]
dev = [
  "mypy>=1.13",
  "numpy<2.5",
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.urls]
Documentation = "https://github.com/maschin96/FEM-Toolbox/tree/main/Doc"
Issues = "https://github.com/maschin96/FEM-Toolbox/issues"
Repository = "https://github.com/maschin96/FEM-Toolbox"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fem_toolbox = ["py.typed"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
  "B",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "RUF",
  "UP",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "mpl_toolkits.*"]
ignore_missing_imports = true
